{{define "node"}}
<div id="node-{{.ID}}" class="node-card w-32 bg-zinc-800 rounded-lg shadow border border-zinc-700 hover:border-zinc-500 hover:-translate-y-1 transition-all flex flex-col overflow-hidden relative group {{if .Editable}}cursor-grab{{end}}"
     data-id="{{.ID}}"
     data-group-id="{{.GroupID}}"
     {{if .Editable}}draggable="true"{{end}}>
    <!-- Action buttons (appear on hover) -->
    <div class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 flex gap-1 transition-opacity">
        {{if .DocsPath}}
        <button hx-get="/docs/view?path={{.DocsPath}}" hx-target="#modal-container" hx-swap="innerHTML" class="p-1 bg-zinc-700 text-blue-300 hover:bg-blue-600 hover:text-white rounded" title="View Docs">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </button>
        {{end}}
        {{if .Editable}}
        <button hx-get="/nodes/{{.ID}}/edit" hx-target="#modal-container" hx-swap="innerHTML" class="p-1 bg-zinc-700 text-zinc-300 hover:bg-zinc-600 hover:text-white rounded" title="Edit Node">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </button>
        <button hx-delete="/nodes/{{.ID}}" hx-target="closest .node-card" hx-swap="outerHTML" class="p-1 bg-zinc-700 text-red-300 hover:bg-red-600 hover:text-white rounded" title="Delete Node">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        {{end}}
    </div>

    <!-- Main Content Link -->
    <a href="{{.ServiceURL}}" target="_blank" class="flex-1 p-3 flex flex-col items-center justify-center gap-2">
        <div class="w-12 h-12 rounded bg-zinc-900 flex items-center justify-center overflow-hidden">
            {{if .IconSource}}
                <img src="{{.IconSource}}" class="w-full h-full object-cover">
            {{else}}
                <span class="text-zinc-500 font-bold text-xl">{{printf "%.1s" .Name}}</span>
            {{end}}
        </div>
        <div class="text-center w-full">
            <h3 class="text-zinc-200 text-sm font-semibold truncate" title="{{.Name}}">{{.Name}}</h3>
            <p class="text-zinc-500 text-[10px] truncate" title="{{.Description}}">{{.Description}}</p>
        </div>
    </a>
    
    <!-- Footer (Health / Repo) -->
    <div class="h-6 bg-zinc-900 border-t border-zinc-700 flex justify-between items-center px-2">
        {{if .HealthCheck}}
            <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]" title="Service Healthy"></div>
        {{else}}
            <div class="w-2 h-2 rounded-full bg-zinc-600" title="Health Check Disabled"></div>
        {{end}}
        
        {{if .RepoURL}}
        <a href="{{.RepoURL}}" target="_blank" class="text-zinc-500 hover:text-white transition-colors" title="Source Repo">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        {{end}}
    </div>
</div>
{{end}}
